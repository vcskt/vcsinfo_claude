version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vcsinfo_postgres
    environment:
      POSTGRES_USER: vcsinfo
      POSTGRES_PASSWORD: vcsinfo_dev_pass
      POSTGRES_DB: vcsinfo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcsinfo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
